<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aquarius">

<title>Aquarius Callout Trainer</title>

<!-- PWA manifest inline -->
<link rel="manifest" href="data:application/json,{%22name%22:%22Aquarius%20Callout%20Trainer%22,%22short_name%22:%22Aquarius%22,%22display%22:%22standalone%22,%22background_color%22:%22%23050a0f%22,%22theme_color%22:%22%23050a0f%22,%22orientation%22:%22landscape%22}">

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

:root {
  --cyan: #00f5ff;
  --gold: #ffd700;
  --blue-team: #4fc3f7;
  --yellow-team: #ffeb3b;
  --red: #ff4444;
  --green: #00e676;
  --bg: #050a0f;
  --panel: #0a1628;
  --border: #1a3a5c;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  width:100%; height:100%;
  background: var(--bg);
  color: #e0f0ff;
  font-family: 'Share Tech Mono', monospace;
  overflow: hidden;
  touch-action: none;
}

/* ── LAYOUT ─────────────────────────────── */
#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
}

/* ── HEADER ─────────────────────────────── */
#header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px 6px;
  background: linear-gradient(180deg, #0d1e38 0%, var(--bg) 100%);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#header h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(0.7rem, 3vw, 1rem);
  font-weight: 900;
  color: var(--cyan);
  letter-spacing: 0.12em;
  text-shadow: 0 0 16px rgba(0,245,255,0.4);
}
#stats-row {
  display: flex;
  gap: 14px;
}
.stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
}
.stat-value {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(0.85rem, 3vw, 1.1rem);
  font-weight: 700;
  color: var(--cyan);
  line-height: 1.1;
}
.stat-label {
  font-size: 0.48rem;
  color: #3a5a7a;
  letter-spacing: 0.08em;
}

/* ── MODE BAR ───────────────────────────── */
#mode-bar {
  display: flex;
  gap: 6px;
  padding: 6px 10px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.mode-btn {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(0.5rem, 2vw, 0.65rem);
  letter-spacing: 0.08em;
  padding: 6px 0;
  flex: 1;
  border: 1px solid var(--border);
  background: transparent;
  color: #4a6a8a;
  cursor: pointer;
  transition: all 0.2s;
  clip-path: polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%);
  -webkit-appearance: none;
}
.mode-btn.active {
  background: rgba(0,245,255,0.1);
  border-color: var(--cyan);
  color: var(--cyan);
}

/* ── MAIN BODY ──────────────────────────── */
#main {
  display: flex;
  flex: 1;
  overflow: hidden;
  min-height: 0;
}

/* ── MAP AREA ───────────────────────────── */
#map-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #020609;
  min-width: 0;
}

#map-img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  display: block;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}

#drop-layer, #study-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
#drop-layer { pointer-events: auto; }

.drop-zone {
  position: absolute;
  transform: translate(-50%,-50%);
  width: 72px;
  height: 22px;
  border: 1px dashed rgba(0,245,255,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.46rem;
  color: rgba(0,245,255,0.25);
  letter-spacing: 0.03em;
  background: rgba(0,0,0,0.15);
  white-space: nowrap;
  transition: border-color 0.15s, background 0.15s;
  cursor: pointer;
}
/* touch target bigger than visual */
.drop-zone::after {
  content:'';
  position:absolute;
  inset: -8px;
}

.drop-zone.drag-over, .drop-zone.touch-over {
  border-color: var(--cyan) !important;
  background: rgba(0,245,255,0.12) !important;
  color: var(--cyan) !important;
  box-shadow: 0 0 10px rgba(0,245,255,0.3);
}
.drop-zone.correct {
  border: 1px solid var(--green) !important;
  background: rgba(0,230,118,0.13) !important;
  color: var(--green) !important;
  font-size: 0.48rem;
  box-shadow: 0 0 8px rgba(0,230,118,0.25) !important;
  pointer-events: none;
}
.drop-zone.wrong {
  border-color: var(--red) !important;
  background: rgba(255,68,68,0.12) !important;
  animation: shake 0.35s ease;
}
.drop-zone.hint-show {
  border-color: var(--gold) !important;
  background: rgba(255,215,0,0.1) !important;
  color: var(--gold) !important;
  font-size: 0.48rem;
}
@keyframes shake {
  0%,100%{transform:translate(-50%,-50%)}
  25%{transform:translate(-50%,-50%) translateX(-5px)}
  75%{transform:translate(-50%,-50%) translateX(5px)}
}

.study-label {
  position: absolute;
  transform: translate(-50%,-50%);
  padding: 2px 7px;
  background: rgba(0,0,0,0.78);
  border: 1px solid rgba(255,255,255,0.15);
  font-size: 0.46rem;
  color: #b0c8e0;
  white-space: nowrap;
  pointer-events: none;
  border-radius: 2px;
}
.study-label.blue { border-color: var(--blue-team); color: var(--blue-team); }
.study-label.yellow { border-color: var(--yellow-team); color: var(--yellow-team); }

/* ── SIDE PANEL (callout bank) ──────────── */
#side-panel {
  width: 150px;
  min-width: 150px;
  background: var(--panel);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#panel-header {
  padding: 8px 10px 6px;
  border-bottom: 1px solid var(--border);
  font-family: 'Orbitron', sans-serif;
  font-size: 0.55rem;
  letter-spacing: 0.12em;
  color: #3a5a7a;
}

#filter-row {
  display: flex;
  gap: 3px;
  padding: 5px 6px;
  border-bottom: 1px solid var(--border);
}
.filter-btn {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.5rem;
  padding: 3px 0;
  flex: 1;
  border: 1px solid var(--border);
  background: transparent;
  color: #3a5a7a;
  cursor: pointer;
  -webkit-appearance: none;
  text-align: center;
}
.filter-btn.active-f { border-color: var(--cyan); color: var(--cyan); background: rgba(0,245,255,0.07); }
.filter-btn.blue-f.active-f { border-color: var(--blue-team); color: var(--blue-team); background: rgba(79,195,247,0.07); }
.filter-btn.yel-f.active-f { border-color: var(--yellow-team); color: var(--yellow-team); background: rgba(255,235,59,0.07); }

#callout-list {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
#callout-list::-webkit-scrollbar { width: 2px; }
#callout-list::-webkit-scrollbar-thumb { background: var(--border); }

.callout-chip {
  padding: 7px 8px;
  background: rgba(0,245,255,0.04);
  border: 1px solid var(--border);
  border-radius: 2px;
  font-size: 0.62rem;
  color: #b0cce0;
  cursor: grab;
  transition: all 0.15s;
  letter-spacing: 0.02em;
  touch-action: none;
  user-select: none;
}
.callout-chip.blue-team  { border-left: 3px solid var(--blue-team); }
.callout-chip.yellow-team{ border-left: 3px solid var(--yellow-team); }
.callout-chip.neutral    { border-left: 3px solid #334455; }
.callout-chip.placed     { opacity:0.22; pointer-events:none; text-decoration:line-through; }
.callout-chip.dragging   { opacity: 0.3; }
.callout-chip.touch-active {
  border-color: var(--cyan);
  color: var(--cyan);
  background: rgba(0,245,255,0.12);
}

/* ── BOTTOM ACTION BAR ──────────────────── */
#action-bar {
  display: flex;
  gap: 6px;
  padding: 7px 10px;
  background: var(--panel);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.action-btn {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(0.45rem, 1.8vw, 0.6rem);
  letter-spacing: 0.07em;
  padding: 8px 0;
  flex: 1;
  border: 1px solid var(--border);
  background: transparent;
  color: #4a6a8a;
  cursor: pointer;
  -webkit-appearance: none;
  clip-path: polygon(5px 0%,100% 0%,calc(100% - 5px) 100%,0% 100%);
  transition: all 0.18s;
}
.action-btn:active { background: rgba(0,245,255,0.08); border-color: var(--cyan); color: var(--cyan); }
.action-btn.gold:active { border-color: var(--gold); color: var(--gold); }
.action-btn.danger:active { border-color: var(--red); color: var(--red); }

/* ── DRAG GHOST ─────────────────────────── */
#drag-ghost {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  background: rgba(0,8,20,0.93);
  border: 1px solid var(--cyan);
  padding: 5px 12px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.7rem;
  color: var(--cyan);
  box-shadow: 0 0 14px rgba(0,245,255,0.4);
  clip-path: polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
  display: none;
  white-space: nowrap;
  transform: translate(-50%,-130%);
}

/* ── TOAST ──────────────────────────────── */
#toast {
  position: fixed;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  padding: 8px 22px;
  font-family: 'Orbitron', sans-serif;
  font-size: 0.7rem;
  letter-spacing: 0.08em;
  border-radius: 2px;
  z-index: 10000;
  opacity: 0;
  transition: opacity 0.25s;
  pointer-events: none;
  white-space: nowrap;
}
#toast.show { opacity:1; }
#toast.success { background:rgba(0,230,118,0.12); border:1px solid var(--green); color:var(--green); }
#toast.error   { background:rgba(255,68,68,0.12);  border:1px solid var(--red);   color:var(--red); }
#toast.info    { background:rgba(255,215,0,0.08);  border:1px solid var(--gold);  color:var(--gold); }

/* ── INSTALL BANNER ─────────────────────── */
#install-banner {
  position: fixed;
  bottom: calc(var(--safe-bottom) + 10px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--panel);
  border: 1px solid var(--cyan);
  padding: 10px 18px;
  font-size: 0.65rem;
  color: #a0c8e8;
  border-radius: 4px;
  z-index: 8000;
  text-align: center;
  max-width: 90vw;
  box-shadow: 0 0 20px rgba(0,245,255,0.2);
  display: none;
}
#install-banner span { color: var(--cyan); font-weight: bold; }
#install-banner button {
  display: block;
  margin: 6px auto 0;
  background: transparent;
  border: 1px solid var(--border);
  color: #4a6a8a;
  font-size: 0.55rem;
  padding: 4px 12px;
  cursor: pointer;
  -webkit-appearance: none;
}

/* ── COMPLETE OVERLAY ───────────────────── */
#complete-screen {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(2,6,14,0.93);
  z-index: 500;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  font-family: 'Orbitron', sans-serif;
  text-align: center;
  padding: 20px;
}
#complete-screen.show { display:flex; }
#complete-screen h2 { font-size: clamp(1.4rem,5vw,2rem); color:var(--cyan); text-shadow:0 0 24px rgba(0,245,255,0.5); }
#complete-screen .score { font-size: clamp(0.9rem,3vw,1.1rem); color:var(--gold); }
#complete-screen p { color:#5a7a9a; font-family:'Share Tech Mono',monospace; font-size:0.75rem; max-width:280px; }
#complete-screen button {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  padding: 12px 28px;
  border: 1px solid var(--cyan);
  background: rgba(0,245,255,0.08);
  color: var(--cyan);
  cursor: pointer;
  margin-top: 6px;
  clip-path: polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
  -webkit-appearance: none;
}

/* scanlines */
body::after {
  content:'';
  position:fixed;
  inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,245,255,0.012) 2px,rgba(0,245,255,0.012) 4px);
  pointer-events:none;
  z-index:9998;
}
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div id="header">
    <h1>AQUARIUS · CALLOUTS</h1>
    <div id="stats-row">
      <div class="stat"><span class="stat-value" id="s-placed">0</span><span class="stat-label">PLACED</span></div>
      <div class="stat"><span class="stat-value" id="s-total">0</span><span class="stat-label">TOTAL</span></div>
      <div class="stat"><span class="stat-value" id="s-streak">0</span><span class="stat-label">STREAK</span></div>
    </div>
  </div>

  <!-- MODE BAR -->
  <div id="mode-bar">
    <button class="mode-btn active" id="btn-quiz"  ontouchend="setMode('quiz',this)"  onclick="setMode('quiz',this)">⚡ QUIZ</button>
    <button class="mode-btn"        id="btn-study" ontouchend="setMode('study',this)" onclick="setMode('study',this)">📖 STUDY</button>
    <button class="mode-btn"        id="btn-free"  ontouchend="setMode('free',this)"  onclick="setMode('free',this)">🔧 FREE</button>
  </div>

  <!-- MAIN -->
  <div id="main">

    <!-- MAP -->
    <div id="map-wrap">
      <img id="map-img" alt="Aquarius Map" draggable="false">
      <div id="drop-layer"></div>
      <div id="study-overlay" style="display:none;pointer-events:none;"></div>
      <div id="complete-screen">
        <h2>MAP CLEARED</h2>
        <div class="score" id="final-score"></div>
        <p id="final-msg"></p>
        <button ontouchend="resetGame()" onclick="resetGame()">↺ PLAY AGAIN</button>
      </div>
    </div>

    <!-- SIDE PANEL -->
    <div id="side-panel">
      <div id="panel-header">▸ CALLOUTS</div>
      <div id="filter-row">
        <button class="filter-btn active-f" ontouchend="setFilter('all',this)"    onclick="setFilter('all',this)">ALL</button>
        <button class="filter-btn blue-f"   ontouchend="setFilter('blue',this)"   onclick="setFilter('blue',this)">BLU</button>
        <button class="filter-btn yel-f"    ontouchend="setFilter('yellow',this)" onclick="setFilter('yellow',this)">YEL</button>
        <button class="filter-btn"          ontouchend="setFilter('neutral',this)"onclick="setFilter('neutral',this)">MID</button>
      </div>
      <div id="callout-list"></div>
    </div>

  </div>

  <!-- ACTION BAR -->
  <div id="action-bar">
    <button class="action-btn gold"   ontouchend="showHint()"   onclick="showHint()">💡 HINT</button>
    <button class="action-btn"        ontouchend="revealAll()"  onclick="revealAll()">👁 REVEAL</button>
    <button class="action-btn danger" ontouchend="resetGame()"  onclick="resetGame()">↺ RESET</button>
  </div>

</div>

<div id="drag-ghost"></div>
<div id="toast"></div>
<div id="install-banner">
  Tap <span>Share → Add to Home Screen</span><br>to install as an app
  <button ontouchend="dismissBanner()" onclick="dismissBanner()">Got it ✕</button>
</div>

// ── STATE ─────────────────────────────────────────────────────
let mode = 'quiz', filter = 'all';
let placed = {}, correct = 0, streak = 0;
let dragging = null; // {callout, chipEl}
let touchActive = null; // for touch drag
let toastTimer;

// ── HELPERS ───────────────────────────────────────────────────
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function getImgBox(){
  const img=document.getElementById('map-img');
  const wrap=document.getElementById('map-wrap');
  const ir=img.getBoundingClientRect();
  const wr=wrap.getBoundingClientRect();
  return {left:ir.left-wr.left,top:ir.top-wr.top,w:ir.width,h:ir.height};
}

function zonePos(c){
  const b=getImgBox();
  return {left:b.left+(c.x/100)*b.w, top:b.top+(c.y/100)*b.h};
}

function updateStats(){
  const p=Object.keys(placed).length, total=CALLOUTS.length;
  document.getElementById('s-placed').textContent=p;
  document.getElementById('s-total').textContent=total;
  document.getElementById('s-streak').textContent=streak;
}

function showToast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className=`show ${type}`;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

// ── BUILD UI ──────────────────────────────────────────────────
function buildChips(){
  const list=document.getElementById('callout-list');
  list.innerHTML='';
  let data=filter==='all'?[...CALLOUTS]:CALLOUTS.filter(c=>c.team===filter);
  if(mode==='quiz') shuffle(data); else data.sort((a,b)=>a.name.localeCompare(b.name));
  data.forEach(c=>{
    const chip=document.createElement('div');
    chip.className=`callout-chip ${c.team}-team`;
    chip.dataset.id=c.id;
    chip.textContent=c.name;
    if(placed[c.id]) chip.classList.add('placed');
    // Mouse drag
    chip.draggable=true;
    chip.addEventListener('dragstart',e=>{
      dragging=c;
      chip.classList.add('dragging');
      const g=document.getElementById('drag-ghost');
      g.textContent=c.name; g.style.display='block';
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setDragImage(new Image(),0,0);
    });
    chip.addEventListener('dragend',()=>{
      chip.classList.remove('dragging');
      document.getElementById('drag-ghost').style.display='none';
      dragging=null;
    });
    // Touch drag
    chip.addEventListener('touchstart',onChipTouchStart,{passive:false});
    list.appendChild(chip);
  });
}

function buildZones(){
  const layer=document.getElementById('drop-layer');
  layer.innerHTML='';
  CALLOUTS.forEach(c=>{
    const z=document.createElement('div');
    z.className='drop-zone';
    z.dataset.id=c.id;
    z.textContent='?';
    const pos=zonePos(c);
    z.style.left=pos.left+'px'; z.style.top=pos.top+'px';
    if(placed[c.id]){z.classList.add('correct');z.textContent=c.name;}
    // Mouse
    z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('drag-over');});
    z.addEventListener('dragleave',()=>z.classList.remove('drag-over'));
    z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('drag-over');handleDrop(c,z);});
    layer.appendChild(z);
  });
}

function buildStudy(){
  const ov=document.getElementById('study-overlay');
  ov.innerHTML='';
  CALLOUTS.forEach(c=>{
    const l=document.createElement('div');
    l.className=`study-label ${c.team}`;
    l.dataset.id=c.id;
    l.textContent=c.name;
    const pos=zonePos(c);
    l.style.left=pos.left+'px'; l.style.top=pos.top+'px';
    l.style.transform='translate(-50%,-50%)';
    ov.appendChild(l);
  });
}

function reposition(){
  const layer=document.getElementById('drop-layer');
  const ov=document.getElementById('study-overlay');
  CALLOUTS.forEach(c=>{
    const pos=zonePos(c);
    [layer,ov].forEach(p=>{
      const el=p.querySelector(`[data-id="${c.id}"]`);
      if(el){el.style.left=pos.left+'px';el.style.top=pos.top+'px';}
    });
  });
}

// ── GAME LOGIC ────────────────────────────────────────────────
function handleDrop(callout, zone){
  if(!dragging) return;
  if(mode==='free'){
    placed[dragging.id]=true;
    zone.classList.add('correct'); zone.textContent=dragging.name;
    markPlaced(dragging.id); updateStats(); return;
  }
  if(dragging.id===callout.id){
    placed[dragging.id]=true;
    zone.classList.add('correct'); zone.textContent=dragging.name;
    markPlaced(dragging.id); correct++; streak++;
    showToast('✓ '+dragging.name,'success');
    updateStats(); checkComplete();
  } else {
    zone.classList.add('wrong'); streak=0;
    showToast('✗ Wrong spot','error');
    setTimeout(()=>zone.classList.remove('wrong'),450);
    updateStats();
  }
}

function markPlaced(id){
  const chip=document.querySelector(`.callout-chip[data-id="${id}"]`);
  if(chip) chip.classList.add('placed');
}

function checkComplete(){
  if(Object.keys(placed).length===CALLOUTS.length){
    const pct=Math.round(correct/CALLOUTS.length*100);
    document.getElementById('final-score').textContent=`${correct}/${CALLOUTS.length} CORRECT (${pct}%)`;
    document.getElementById('final-msg').textContent=
      pct===100?'PERFECT — Callout God 🎯':
      pct>=80 ?'SOLID — Strong map knowledge':
      pct>=60 ?'DECENT — Review what you missed':
               'Keep grinding — reps build memory';
    document.getElementById('complete-screen').classList.add('show');
  }
}

function showHint(){
  const unplaced=CALLOUTS.filter(c=>!placed[c.id]);
  if(!unplaced.length) return;
  const target=unplaced[Math.floor(Math.random()*unplaced.length)];
  const zone=document.querySelector(`.drop-zone[data-id="${target.id}"]`);
  if(!zone) return;
  zone.classList.add('hint-show'); zone.textContent=target.name;
  showToast('HINT: '+target.name,'info');
  setTimeout(()=>{zone.classList.remove('hint-show');if(!placed[target.id])zone.textContent='?';},2800);
}

function revealAll(){
  CALLOUTS.forEach(c=>{
    if(!placed[c.id]){
      placed[c.id]=true;
      const z=document.querySelector(`.drop-zone[data-id="${c.id}"]`);
      if(z){z.classList.add('correct');z.textContent=c.name;}
      markPlaced(c.id);
    }
  });
  updateStats();
}

function resetGame(){
  placed={}; correct=0; streak=0;
  document.getElementById('complete-screen').classList.remove('show');
  buildChips(); buildZones(); buildStudy(); updateStats();
}

function setMode(m,btn){
  if(event) event.preventDefault();
  mode=m;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const ov=document.getElementById('study-overlay');
  const bank=document.getElementById('side-panel');
  if(m==='study'){
    ov.style.display='block';
    bank.style.opacity='0.35';
    bank.style.pointerEvents='none';
  } else {
    ov.style.display='none';
    bank.style.opacity='1';
    bank.style.pointerEvents='auto';
  }
  resetGame();
}

function setFilter(f,btn){
  if(event) event.preventDefault();
  filter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active-f'));
  btn.classList.add('active-f');
  buildChips();
}

// ── TOUCH DRAG SYSTEM ─────────────────────────────────────────
let touchDragCallout = null;
let touchDragEl = null;
const ghost = document.getElementById('drag-ghost');

function onChipTouchStart(e){
  if(e.target.classList.contains('placed')) return;
  e.preventDefault();
  const chip = e.currentTarget;
  const id = chip.dataset.id;
  touchDragCallout = CALLOUTS.find(c=>c.id===id);
  if(!touchDragCallout) return;
  chip.classList.add('touch-active');
  touchDragEl = chip;
  dragging = touchDragCallout;
  ghost.textContent = touchDragCallout.name;
  ghost.style.display = 'block';
  const t = e.touches[0];
  ghost.style.left = t.clientX+'px';
  ghost.style.top  = t.clientY+'px';
  document.addEventListener('touchmove', onTouchMove, {passive:false});
  document.addEventListener('touchend',  onTouchEnd,  {passive:false});
}

function onTouchMove(e){
  e.preventDefault();
  const t = e.touches[0];
  ghost.style.left = t.clientX+'px';
  ghost.style.top  = (t.clientY - 40)+'px';
  // highlight zone under finger
  ghost.style.display='none';
  const el = document.elementFromPoint(t.clientX, t.clientY);
  ghost.style.display='block';
  document.querySelectorAll('.drop-zone.touch-over').forEach(z=>z.classList.remove('touch-over'));
  if(el && el.classList.contains('drop-zone')) el.classList.add('touch-over');
}

function onTouchEnd(e){
  e.preventDefault();
  const t = e.changedTouches[0];
  ghost.style.display='none';
  document.querySelectorAll('.drop-zone.touch-over').forEach(z=>z.classList.remove('touch-over'));
  if(touchDragEl) touchDragEl.classList.remove('touch-active');
  // find drop target
  ghost.style.display='none';
  const el = document.elementFromPoint(t.clientX, t.clientY);
  if(el && el.classList.contains('drop-zone') && !el.classList.contains('correct')){
    const targetId = el.dataset.id;
    const targetCallout = CALLOUTS.find(c=>c.id===targetId);
    if(targetCallout) handleDrop(targetCallout, el);
  }
  dragging = null; touchDragCallout = null; touchDragEl = null;
  document.removeEventListener('touchmove', onTouchMove);
  document.removeEventListener('touchend',  onTouchEnd);
}

// ── MOUSE GHOST ───────────────────────────────────────────────
document.addEventListener('dragover', e=>{
  ghost.style.left = e.clientX+'px';
  ghost.style.top  = (e.clientY - 30)+'px';
});

// ── RESIZE ────────────────────────────────────────────────────
window.addEventListener('resize', ()=>setTimeout(reposition, 80));
window.addEventListener('orientationchange', ()=>setTimeout(()=>{reposition();},300));

// ── INSTALL BANNER ────────────────────────────────────────────
function dismissBanner(){
  document.getElementById('install-banner').style.display='none';
  localStorage.setItem('aq-banner-dismissed','1');
}
function maybeShowBanner(){
  if(localStorage.getItem('aq-banner-dismissed')) return;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.navigator.standalone;
  if(isIOS && !isStandalone){
    setTimeout(()=>{ document.getElementById('install-banner').style.display='block'; }, 2500);
  }
}
